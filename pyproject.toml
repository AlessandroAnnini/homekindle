[project]
name = "homekindle"
version = "0.2.2"
requires-python = ">=3.12"
dependencies = [
  "pillow>=10.0.0",
  "pyyaml>=6.0",
  "icalendar>=5.0.0",
  "recurring-ical-events>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
src = ["custom_components", "tests"]
